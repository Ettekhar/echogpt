# Render blueprint - gives the API a permanent hostname instead of the
# per-restart hostname a Cloudflare quick tunnel hands out.
#
# Setup: push this repo to GitHub, then in Render choose "New > Blueprint"
# and point it at the repository. Render reads this file and creates both
# the Postgres instance and the web service wired together.
#
# Secrets: fill in the `sync: false` values at deploy time, or set them in
# the service's Environment tab. Never commit real values here.
#
# ---------------------------------------------------------------------------
# Before using this, read DEPLOY.md. Two things matter:
#
#  1. A free Render *web service* idles out after ~15 minutes and cold-starts
#     on the next request, so a reviewer opening the link first sees a 30-60s
#     "API Offline" banner. `fly.toml` avoids that (see DEPLOY.md) and is the
#     recommended path.
#  2. Render's free Postgres expires after 30 days. If the demo has to outlive
#     that, create a free database at neon.tech and set DATABASE_URL to it,
#     deleting the `databases:` block below and the DATABASE_URL envVar here.
# ---------------------------------------------------------------------------

databases:
  - name: echogpt-db
    databaseName: echogpt
    user: echogpt
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: echogpt-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health
    # `build:seed` is a build-time step: the seed is TypeScript and ts-node is a
    # devDependency, so it has to be compiled here rather than run at boot.
    buildCommand: npm ci && npx prisma generate && npm run build && npm run build:seed
    # Migrations then seed on every boot. Both are idempotent, so a restart or
    # a scale-out converges to the intended state instead of corrupting it.
    startCommand: npm run start:prod:full
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echogpt-db
          property: connectionString
      - key: API_PREFIX
        value: api/v1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Must be exactly 32 bytes of hex (64 characters). Set your own; a
      # placeholder here would silently break decryption of stored provider keys.
      - key: PROVIDER_KEY_ENCRYPTION_SECRET
        sync: false
      - key: CORS_ORIGIN
        # Comma-separated allowlist, e.g. https://echogpt.taion16240.workers.dev
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-3.8-flash
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_PASSWORD
        sync: false
      - key: FREE_PLAN_DAILY_LIMIT
        value: "20"
      - key: PREMIUM_PLAN_DAILY_LIMIT
        value: "1000"
